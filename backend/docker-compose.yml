services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/dq/health/ready', timeout=15)
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 40s
